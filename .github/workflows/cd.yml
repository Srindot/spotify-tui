name: Release

# Pushing a tag like v0.26.0 builds spotify_tui and attaches it to a GitHub
# release.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libasound2-dev libdbus-1-dev

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release -p spotify_player --features image

      - name: Package
        run: |
          name=spotify_tui-${GITHUB_REF_NAME}-${TARGET}
          mkdir "$name"
          cp target/release/spotify_tui README.md LICENSE "$name"/
          cp -r docs examples "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: spotify_tui-*.tar.gz*
