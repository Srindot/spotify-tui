# Rosé Pine (https://rosepinetheme.com/palette), built in.
# No background colour: the terminal's own background shows through.
# ANSI slots follow Rosé Pine's terminal ports:
# black=overlay red=love green=pine yellow=gold blue=foam magenta=iris cyan=rose white=text

[[themes]]
name = "rose-pine"
[themes.palette]
foreground = "#e0def4"
black = "#26233a"
red = "#eb6f92"
green = "#31748f"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ebbcba"
white = "#e0def4"
bright_black = "#6e6a86"
bright_red = "#eb6f92"
bright_green = "#31748f"
bright_yellow = "#f6c177"
bright_blue = "#9ccfd8"
bright_magenta = "#c4a7e7"
bright_cyan = "#ebbcba"
bright_white = "#e0def4"
[themes.component_style]
block_title = { fg = "#c4a7e7", modifiers = ["Bold"] }
border = { fg = "#403d52" }
selection = { fg = "#e0def4", bg = "#403d52", modifiers = ["Bold"] }
playback_status = { fg = "#ebbcba", modifiers = ["Bold"] }
playback_track = { fg = "#e0def4", modifiers = ["Bold"] }
playback_artists = { fg = "#ebbcba" }
playback_album = { fg = "#c4a7e7", modifiers = ["Italic"] }
playback_genres = { fg = "#6e6a86" }
playback_metadata = { fg = "#9ccfd8" }
playback_progress_bar = { fg = "#ebbcba" }
playback_progress_bar_unfilled = { fg = "#403d52" }
current_playing = { fg = "#f6c177", modifiers = ["Bold"] }
page_desc = { fg = "#c4a7e7", modifiers = ["Bold"] }
playlist_desc = { fg = "#6e6a86" }
table_header = { fg = "#f6c177", modifiers = ["Bold"] }
like = { fg = "#eb6f92" }
lyrics_played = { fg = "#6e6a86" }
lyrics_playing = { fg = "#f6c177", modifiers = ["Bold"] }
visualization = { low = "#9ccfd8", mid = "#c4a7e7", high = "#eb6f92" }

